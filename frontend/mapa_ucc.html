<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartParkU - Mapa UCC Pasto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }
        .bottom-sheet {
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bottom-sheet.active {
            transform: translateY(0);
        }
        .parking-slot {
            transition: all 0.2s ease;
        }
        .central-street {
            background-image: linear-gradient(90deg, #e2e8f0 25%, transparent 25%, transparent 50%, #e2e8f0 50%, #e2e8f0 75%, transparent 75%, transparent 100%);
            background-size: 40px 100%;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4">

    <!-- Mobile Container -->
    <div class="w-full max-w-sm mx-auto bg-gray-50 min-h-screen sm:min-h-[844px] shadow-2xl sm:rounded-[3rem] overflow-hidden border border-gray-200 relative flex flex-col">
        
        <!-- Header -->
        <header class="bg-white px-6 py-8 pb-4 relative">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-3xl font-extrabold text-[#A3E4D7] tracking-tight">SmartParkU</h1>
                    <p class="text-xs font-medium text-gray-400 mt-1">UCC Campus Pasto</p>
                </div>
                <div class="bg-emerald-50 px-3 py-2 rounded-2xl border border-emerald-100 flex flex-col items-end shadow-sm">
                    <span class="text-[10px] font-bold text-emerald-600 uppercase tracking-widest">Ahorro CO₂</span>
                    <span class="text-sm font-bold text-emerald-700">120g</span>
                </div>
            </div>

            <!-- Two Wheel Zones -->
            <div class="grid grid-cols-2 gap-3 mt-8">
                <div class="bg-white p-3 rounded-2xl border border-gray-100 shadow-sm">
                    <div class="flex items-center space-x-2 mb-2">
                        <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
                        <span class="text-[10px] font-bold text-gray-500 uppercase">Motos</span>
                    </div>
                    <div class="grid grid-cols-4 gap-1">
                        <div class="h-4 bg-emerald-100 rounded-sm"></div>
                        <div class="h-4 bg-emerald-100 rounded-sm"></div>
                        <div class="h-4 bg-rose-100 rounded-sm"></div>
                        <div class="h-4 bg-emerald-100 rounded-sm"></div>
                    </div>
                </div>
                <div class="bg-white p-3 rounded-2xl border border-gray-100 shadow-sm">
                    <div class="flex items-center space-x-2 mb-2">
                        <div class="w-2 h-2 rounded-full bg-blue-400"></div>
                        <span class="text-[10px] font-bold text-gray-500 uppercase">Bicicletas</span>
                    </div>
                    <div class="grid grid-cols-4 gap-1">
                        <div class="h-4 bg-emerald-100 rounded-sm"></div>
                        <div class="h-4 bg-emerald-100 rounded-sm"></div>
                        <div class="h-4 bg-emerald-100 rounded-sm"></div>
                        <div class="h-4 bg-emerald-100 rounded-sm"></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Map Section -->
        <main class="flex-1 px-6 py-4 flex flex-col overflow-y-auto">
            
            <div class="relative flex flex-col items-center">
                
                <!-- Row 1 (Slots 1-11) -->
                <div class="grid grid-cols-11 gap-1 w-full mb-2">
                    <!-- Generating slots 1 to 11 -->
                    <script>
                        for(let i=1; i<=11; i++) {
                            document.write(`
                                <button id="slot-${i}" onclick="selectSlot(${i})" class="parking-slot h-14 bg-emerald-200 rounded-md flex items-center justify-center text-[10px] font-bold text-emerald-800 shadow-sm hover:ring-2 hover:ring-emerald-400 focus:outline-none">
                                    ${i}
                                </button>
                            `);
                        }
                    </script>
                </div>

                <!-- Central Street -->
                <div class="w-full h-16 bg-gray-200 central-street rounded-lg flex items-center justify-center opacity-60 mb-2">
                    <div class="flex space-x-8">
                        <div class="w-8 h-1 bg-white/50 rounded-full"></div>
                        <div class="w-8 h-1 bg-white/50 rounded-full"></div>
                        <div class="w-8 h-1 bg-white/50 rounded-full"></div>
                    </div>
                </div>

                <!-- Row 2 (Slots 12-22) -->
                <div class="grid grid-cols-11 gap-1 w-full">
                    <!-- Generating slots 12 to 22 -->
                    <script>
                        for(let i=12; i<=22; i++) {
                            document.write(`
                                <button id="slot-${i}" onclick="selectSlot(${i})" class="parking-slot h-14 bg-emerald-200 rounded-md flex items-center justify-center text-[10px] font-bold text-emerald-800 shadow-sm hover:ring-2 hover:ring-emerald-400 focus:outline-none">
                                    ${i}
                                </button>
                            `);
                        }
                    </script>
                </div>

                <!-- Access Indicator -->
                <div class="w-full flex justify-end mt-6">
                    <div class="bg-white px-4 py-2 rounded-xl border border-gray-100 shadow-sm flex items-center space-x-3">
                        <div class="flex flex-col items-end">
                            <span class="text-[9px] font-bold text-gray-400 uppercase tracking-tighter leading-none">Acceso Real</span>
                            <span class="text-[10px] font-bold text-gray-700">Entrada / Salida</span>
                        </div>
                        <div class="flex space-x-1">
                            <svg class="w-4 h-4 text-emerald-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
                            <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                        </div>
                    </div>
                </div>

            </div>

        </main>

        <!-- Bottom Sheet -->
        <div id="overlay" onclick="closeSheet()" class="hidden absolute inset-0 bg-black/20 backdrop-blur-[2px] z-40 transition-opacity duration-300"></div>
        
        <div id="bottom-sheet" class="bottom-sheet absolute bottom-0 left-0 right-0 bg-white rounded-t-[2.5rem] p-8 z-50 shadow-[0_-10px_40px_rgba(0,0,0,0.1)]">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-8"></div>
            <div class="flex items-center space-x-4 mb-6">
                <div class="w-14 h-14 bg-emerald-50 rounded-2xl flex items-center justify-center">
                    <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <div>
                    <h3 id="sheet-title" class="text-xl font-bold text-gray-800">Cajón Seleccionado</h3>
                    <p class="text-sm text-gray-400 font-medium">UCC Campus Pasto • Disponible</p>
                </div>
            </div>
            <p class="text-gray-500 text-sm leading-relaxed mb-8">¿Deseas reservar este espacio? Al hacerlo, reduces el tráfico innecesario y contribuyes a un campus más sostenible.</p>
            <button class="w-full bg-[#A3E4D7] hover:bg-[#8fd1c4] text-emerald-900 font-bold py-4 rounded-2xl shadow-lg shadow-emerald-100 transition-all active:scale-95">
                Reservar Cupo
            </button>
        </div>

    </div>

    <script>
        const sheet = document.getElementById('bottom-sheet');
        const overlay = document.getElementById('overlay');
        const sheetTitle = document.getElementById('sheet-title');

        // Initialize 5 random occupied slots
        function initMap() {
            const occupied = [];
            while(occupied.length < 5) {
                const r = Math.floor(Math.random() * 22) + 1;
                if(!occupied.includes(r)) {
                    occupied.push(r);
                    const slot = document.getElementById(`slot-${r}`);
                    slot.classList.remove('bg-emerald-200', 'text-emerald-800');
                    slot.classList.add('bg-rose-200', 'text-rose-800', 'cursor-not-allowed');
                }
            }
        }

        function selectSlot(id) {
            const slot = document.getElementById(`slot-${id}`);
            if(slot.classList.contains('bg-rose-200')) return;

            sheetTitle.innerText = `Cajón ${id} Seleccionado`;
            sheet.classList.add('active');
            overlay.classList.remove('hidden');
        }

        function closeSheet() {
            sheet.classList.remove('active');
            overlay.classList.add('hidden');
        }

        window.onload = initMap;
    </script>
</body>
</html>

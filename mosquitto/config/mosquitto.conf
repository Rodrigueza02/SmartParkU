# Configuración Mosquitto local para SmartParkU
# Solo para desarrollo — sin autenticación ni TLS (red interna Docker)

# Puerto MQTT estándar (sin TLS)
listener 1883
allow_anonymous true

# Puerto WebSocket (para debug desde navegador o MQTT Explorer)
listener 9001
protocol websockets
allow_anonymous true

# Persistencia de mensajes
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest file /mosquitto/log/mosquitto.log
log_type all
